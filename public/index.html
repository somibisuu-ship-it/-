<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#e6007e"><title>랜선 투데이 투다리</title><link rel="stylesheet" href="/styles.css"></head><body>
<section id="lobby"><div class="lobbyCard"><h1>랜선 투데이 <b>투다리</b></h1><p>U+ 공간에서 만나는 6인 온라인 술자리</p><div class="form"><input id="name" maxlength="10" placeholder="닉네임"><input id="room" maxlength="12" value="MP" placeholder="방 코드"><div id="avatarPreview"></div><div class="row"><select id="hair"><option value="short">숏 헤어</option><option value="bob">보브 헤어</option><option value="long">롱 헤어</option></select><select id="outfit"><option value="uplus">U+ 유니폼</option><option value="lg">LG</option><option value="hanwha">한화</option><option value="samsung">삼성</option><option value="doosan">두산</option><option value="kia">KIA</option><option value="casual">캐주얼</option></select></div><button id="join">입장하기</button><div id="joinError"></div></div></div></section>
<section id="game" class="hidden"><div id="worldWrap"><canvas id="world" width="1536" height="1024"></canvas><div id="hud"><b id="roomLabel"></b><span id="onlineLabel"></span><button id="copyLink">초대 링크</button></div><div id="seatBar"></div><div id="actionBar"><button id="stand">일어서기</button><button id="drinkBtn">술 고르기</button><button id="raise">잔 들기</button><button id="sip">마시기</button><button id="cheersBtn">건배 제의</button></div><div id="joystick"><div id="stick"></div></div></div><aside id="phone"><div class="phoneTop">19:29　5G ▮▮▮</div><header>랜선 투다리 단체방<small id="phoneOnline"></small></header><div id="messages"></div><form id="chatForm"><input id="chatInput" maxlength="120" placeholder="메시지"><button>➤</button></form></aside></section>
<div id="drinkModal" class="modal hidden"><div><h2>잔 채우기</h2><select id="drink"><option>소주</option><option>맥주</option><option>소맥</option><option>연맥</option><option>하이볼</option><option>와인</option><option>논알코올</option></select><section id="mix" class="hidden"><span id="mixLabel"></span><input id="ratio" type="range" min="10" max="90" step="10" value="30"></section><button id="fill">선택</button><button data-close="drinkModal">닫기</button></div></div>
<div id="cheersModal" class="modal hidden"><div><h2>건배 제의</h2><textarea id="cheersText" placeholder="오늘도 함께한 우리를"></textarea><p>마지막은 자동으로 “위하여!”</p><button id="sendCheers">건배!</button><button data-close="cheersModal">닫기</button></div></div><div id="toast"></div>
<script src="/socket.io/socket.io.js"></script><script src="/game.js"></script></body></html>
